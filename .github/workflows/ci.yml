name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # All automated tests execute strictly on Git-tracked runtime datasets
      # (India Agriculture Crop Production.csv, CACP cleaned CSV, mandi & weather
      # summary Parquets, and serialized XGBoost models). Large raw local-only
      # files (mandi_prices_integrated.parquet, raw IMD CSVs, .GRD binaries) are
      # NOT required for CI.
      - name: Run automated test suite with coverage
        run: |
          python -m pytest tests --cov=src --cov-report=term-missing -v
